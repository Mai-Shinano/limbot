sns = "Misskey"
sns_url = "https://example.net"
# Misskey API token (required)
sns_token = "your_misskey_api_token"
# Local LLM endpoint (OpenAI-compatible)
# Example: Ollama with openai compatibility
openai_url = "https://api.groq.com/openai/v1"
# local endpoints can omit token
# openai_token = ""
# Groq
groq_api_key = "gsk_..."
# Mistral AI
# openai_url = "https://api.mistral.ai/v1"
# mistral_api_key = "your_mistral_api_key"
# Gemini example (OpenAI-compatible endpoint):
# openai_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# gemini_api_key = "AIza..."
openai_model = "llama-3.3-70b-versatile"
# Optional: autonomous random post interval (seconds). unset to disable.
# random_post_interval_sec = 1800
# Optional visibility for autonomous posts: public/home/followers/specified
# random_post_visibility = "home"
# Optional quiet hours for autonomous posts (local time, 0-23, [start, end))
# random_post_quiet_start_hour = 0
# random_post_quiet_end_hour = 7
# Optional: proactive autonomous reply from home timeline (seconds). unset to disable.
# proactive_reply_interval_sec = 900
# Optional: chance to reply each interval (0-100)
# proactive_reply_probability_percent = 35
# Optional: cap proactive replies per hour
# proactive_reply_max_per_hour = 4
# Optional visibility for proactive replies
# proactive_reply_visibility = "home"
master_acct = "your_acct"
memory_file = "memory.json"
instruction = """instruction to an LLM goes here..."""
